<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        form {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input, button {
            padding: 10px;
            font-size: 15px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background: #2563eb;
            color: white;
        }

        .delete {
            background: #dc2626;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📦 Inventory Tracker</h1>

        <!-- Add Product Form -->
        <form action="/add" method="POST">

            <input
                type="text"
                name="name"
                placeholder="Product Name"
                required
            >

            <input
                type="number"
                name="quantity"
                placeholder="Quantity"
                required
            >

            <input
                type="number"
                step="0.01"
                name="price"
                placeholder="Price"
                required
            >

            <button type="submit">Add Product</button>

        </form>


        <!-- Products Table -->
        <table>

            <tr>
                <th>ID</th>
                <th>Product Name</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Action</th>
            </tr>


            {% for product in products %}

            <tr>

                <td>{{ product.id }}</td>

                <td>{{ product.name }}</td>

                <td>{{ product.quantity }}</td>

                <td>${{ product.price }}</td>

                <td>

                    <!-- Edit Button -->
                    <a href="/edit/{{ product.id }}">
                        <button>Edit</button>
                    </a>


                    <!-- Delete Button -->
                    <a href="/delete/{{ product.id }}">
                        <button class="delete">Delete</button>
                    </a>

                </td>

            </tr>

            {% endfor %}

        </table>

    </div>

</body>
</html>
