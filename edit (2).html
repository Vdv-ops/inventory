<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product</title>
</head>

<body>

    <h1>Edit Product</h1>

    <form action="/update/{{ product.id }}" method="POST">

        <input
            type="text"
            name="name"
            value="{{ product.name }}"
            required
        >

        <input
            type="number"
            name="quantity"
            value="{{ product.quantity }}"
            required
        >

        <input
            type="number"
            step="0.01"
            name="price"
            value="{{ product.price }}"
            required
        >

        <button type="submit">Update Product</button>

    </form>

    <br>

    <a href="/">Back to Inventory</a>

</body>
</html>
